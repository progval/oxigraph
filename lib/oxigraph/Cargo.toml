[package]
name = "oxigraph"
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["RDF", "SPARQL", "graph-database", "database"]
categories = ["database-implementations"]
repository = "https://github.com/oxigraph/oxigraph/tree/main/lib/oxigraph"
homepage = "https://oxigraph.org/"
documentation = "https://docs.rs/oxigraph"
description = "SPARQL database and RDF toolkit"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["rocksdb", "succinct"]
rocksdb = ["oxrocksdb-sys"]
succinct = ["anyhow", "bytemuck", "clap", "deko", "dsi-progress-logger", "dsi-bitstream", "deko", "epserde", "fallible-iterator", "lender", "log", "itertools", "mmap-rs", "quick_cache", "rayon", "rdst", "serde", "serde/derive", "serde_json", "sux", "tempfile", "thread_local", "tiny-varint", "value-traits", "webgraph", "webgraph-algo", "webgraph-cli"]
js = ["getrandom/wasm_js", "oxsdatatypes/js", "js-sys"]
http-client = ["oxhttp"]
http-client-native-tls = ["http-client", "oxhttp/native-tls"]
http-client-rustls-webpki = ["http-client", "oxhttp/rustls-ring-webpki"]
http-client-rustls-native = ["http-client", "oxhttp/rustls-ring-native"]
rocksdb-pkg-config = ["oxrocksdb-sys/pkg-config"]
rocksdb-debug = []
rdf-12 = ["oxrdfio/rdf-12", "spareval/sparql-12"]

[dependencies]
dashmap.workspace = true
oxiri.workspace = true
oxrdf = { workspace = true, features = ["oxsdatatypes", "serde", "rdfc-10"] }
oxrdfio.workspace = true
oxsdatatypes.workspace = true
rand.workspace = true
rustc-hash.workspace = true
siphasher.workspace = true
sparesults.workspace = true
spargebra = { workspace = true, features = ["sep-0002", "sep-0006"] }
spareval = { workspace = true, features = ["sep-0002", "sep-0006", "calendar-ext"] }
thiserror.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc.workspace = true
oxhttp = { workspace = true, optional = true }
oxrocksdb-sys = { workspace = true, optional = true }

# succinct storage
anyhow = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"], optional = true }
clap = { workspace = true, optional = true }
deko = { workspace = true, optional = true }
dsi-progress-logger = { workspace = true, optional = true }
dsi-bitstream = { workspace = true, optional = true }
epserde = { workspace = true, optional = true }
fallible-iterator = { workspace = true, optional = true }
lender = { workspace = true, optional = true }
log = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
mmap-rs = { workspace = true, optional = true }
quick_cache = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
rdst = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sux = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thread_local = { workspace = true, optional = true }
tiny-varint = { workspace = true, optional = true }
value-traits = { workspace = true, optional = true }
webgraph = { workspace = true, optional = true }
webgraph-algo = { workspace = true, optional = true }
webgraph-cli = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom.workspace = true
js-sys = { workspace = true, optional = true }
rand = "0.9"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
codspeed-criterion-compat.workspace = true
csv.workspace = true
oxhttp = { workspace = true, features = ["rustls-ring-native"] }
bzip2.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "store"
harness = false
required-features = ["rocksdb"]
